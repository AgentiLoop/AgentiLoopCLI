[package]
name = "agentiloop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agentiloop"
path = "src/main.rs"

[dependencies]
agentiloop-core = { path = "../agentiloop-core" }
agentiloop-provider = { path = "../agentiloop-provider" }
agentiloop-tools = { path = "../agentiloop-tools" }
agentiloop-mcp = { path = "../agentiloop-mcp" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
rustyline = "15"
ratatui = "0.30"
textwrap = "0.16"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
# Pure-Rust regex backend (no oniguruma C build); bundled syntaxes + themes.
syntect = { version = "5", default-features = false, features = ["default-fancy", "yaml-load"] }
