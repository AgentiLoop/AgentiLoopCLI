[workspace]
resolver = "2"
members = [
    "crates/agentiloop-core",
    "crates/agentiloop-provider",
    "crates/agentiloop-tools",
    "crates/agentiloop-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/AgentiLoop/AgentiLoopCLI"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
